{% extends "base.html" %}
{% block title %}Página no encontrada — API Hub{% endblock %}
{% block content %}
  <div style="max-width:480px;margin:5rem auto;text-align:center">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:3rem 2rem;box-shadow:var(--shadow)">
      <div style="font-size:4rem;font-weight:800;color:var(--blue);letter-spacing:-4px;line-height:1">404</div>
      <h2 style="margin:1rem 0 .5rem;font-size:1.3rem;font-weight:700">Página no encontrada</h2>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:2rem">La ruta que buscas no existe o ha sido movida.</p>
      <a href="/" style="display:inline-block;background:var(--blue);color:#fff;padding:.7rem 1.8rem;border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;transition:opacity .2s" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
        Volver al catálogo
      </a>
    </div>
  </div>
{% endblock %}
