<!-- 500.html -->
{% extends "base.html" %}
{% block title %}Error del servidor — API Hub{% endblock %}
{% block content %}
  <!-- Esta plantilla se muestra cuando ocurre un error interno en el servidor (error 500). Muestra un mensaje de error con un diseño simple y un botón para volver al catálogo de APIs. -->
  <div class="error-page">
    <div class="error-code">500</div>
    <h1>Error interno del servidor</h1>
    <p>Algo salió mal en nuestro lado. Inténtalo de nuevo en unos momentos.</p>
    <a href="/" class="btn-primary">← Volver al catálogo</a>
  </div>
{% endblock %}
